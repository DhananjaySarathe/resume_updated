name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The build also runs the non-blocking Prunify self-audit (prebuild).
      - run: npm run build
      - run: npm run check:budget
      - run: npm run check:prunify
